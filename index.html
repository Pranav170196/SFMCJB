<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <title>TESTING: Custom Journey Builder Activity</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script type="text/javascript" src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script type="text/javascript" src="js/require.js"></script>
    <script type="text/javascript">
        (function() {
            var config = {
                baseUrl: 'js'
            };

            var dependencies = [
                'customActivity'
            ];

            require(config, dependencies); 
        })();
    </script>

    <!--Styles-->
    <style type="text/css">
        body {
            padding: 20px;
            margin: 0;
        }
        #step1 {
            display: block;
        }
    </style>

</head>
<body>
<div id="step1" class="step">
    <h2>Configure suggestion details for HCP:</h2>
    <hr>
    <div class="form-group">
        <div><label for="hcpId">HCP ID:</label></div>
        <input class="form-control" id="hcpId" type="text" name="hcpId" value="">        
    </div>           
    <div class="form-group">
        <div><label for="scenarioId">Scenario Id:</label></div>
        <input class="form-control" id="scenarioId" type="text" name="scenarioId" value="">
    </div>     
    <div class="form-group">
        <div><label for="marketCode">Market Code:</label></div>
        <input class="form-control" id="marketCode" type="text" name="marketCode" value="">
    </div>
    <div class="form-group">
        <div><label for="brandName">Brand Name:</label></div>
        <input class="form-control" id="brandName" type="text" name="brandName" value="">
    </div>    

</div>
</body>
</html>
